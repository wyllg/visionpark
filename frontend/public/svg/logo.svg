<svg width="64" height="64" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <style>
            @keyframes shimmer-bottom-c {
              0%   { stroke: #e45b3d; opacity: 0.6; }
              33%  { stroke: #e5873b; opacity: 0.8; }
              66%  { stroke: #3e787b; opacity: 0.5; }
              100% { stroke: #e45b3d; opacity: 0.6; }
            }
            @keyframes shimmer-top-c {
              0%   { stroke: #eceed5; }
              33%  { stroke: #e45b3d; }
              66%  { stroke: #e5873b; }
              100% { stroke: #eceed5; }
            }
            @keyframes float-c {
              0%, 100% { transform: translateY(0px); }
              50%       { transform: translateY(-1px); }
            }
            .dbc { animation: shimmer-bottom-c 3s ease-in-out infinite; }
            .dtc { animation: shimmer-top-c 3s ease-in-out infinite; animation-delay: -1.5s; }
            .fgc { animation: float-c 3s ease-in-out infinite; transform-origin: 12px 12px; }
          </style>
          <g class="fgc">
            <path class="dbc"
              d="M12 10L4 15L12 20L20 15L12 10Z"
              stroke="#e45b3d" stroke-width="1.5" stroke-linejoin="round"/>
            <path class="dtc"
              d="M12 4L4 9L12 14L20 9L12 4Z"
              stroke="#eceed5" stroke-width="1.5" stroke-linejoin="round"/>
          </g>
        </svg>